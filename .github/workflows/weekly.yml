name: Weekly update

on:
  schedule:
    - cron: "17 5 * * 1"      # every Monday, around 6:17 in Paris
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      force_ingest:
        description: "Rescan the registry even if this month is already done"
        type: boolean
        default: false
  push:                        # republish when you edit your picks or settings
    branches: [main]
    paths: ["picks.yaml", "config.yaml", "site/index.html", "site/style.css", "site/app.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force_ingest && '--force-ingest' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m pipeline.run --build-only
          else
            python -m pipeline.run $FORCE
          fi

      - name: Save the data in the repository
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data site/data
          git add data site/data
          if ! git diff --cached --quiet; then
            git commit -m "Radar update $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
